<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>正态分布实验室</title>
  <style>
    :root {
      --ink: #16202d;
      --sub: #546170;
      --line: rgba(22, 32, 45, 0.12);
      --card: rgba(255, 251, 245, 0.92);
      --card-strong: #fffdfa;
      --accent: #245e9d;
      --accent2: #b25733;
      --shadow: 0 24px 60px rgba(22, 58, 100, 0.12);
      --radius: 24px;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      color: var(--ink);
      font-family: "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
      background:
        radial-gradient(circle at top right, rgba(92, 150, 210, 0.18), transparent 24%),
        radial-gradient(circle at left top, rgba(36, 94, 157, 0.12), transparent 20%),
        linear-gradient(180deg, #eef4fb 0%, #e4edf8 100%);
      min-height: 100vh;
    }
    .shell {
      width: min(1400px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 20px 0 32px;
    }

    /* Top bar */
    .topbar {
      display: flex;
      align-items: center;
      padding: 12px 22px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(240, 248, 255, 0.85);
      backdrop-filter: blur(10px);
      box-shadow: 0 12px 32px rgba(22, 58, 100, 0.08);
    }
    .topbar a {
      text-decoration: none;
      color: var(--accent);
      font-size: 16px;
      font-weight: 800;
    }

    /* Panel */
    .panel {
      margin-top: 14px;
      padding: 24px 28px;
      border-radius: var(--radius);
      border: 1px solid rgba(255, 255, 255, 0.55);
      background: var(--card);
      box-shadow: var(--shadow);
      backdrop-filter: blur(10px);
    }

    /* Hero */
    .hero {
      text-align: center;
      padding: 6px 0 18px;
    }
    .hero h1 {
      margin: 0 0 6px;
      font-size: clamp(34px, 4.5vw, 52px);
      letter-spacing: 0.06em;
      color: var(--accent);
    }
    .hero p {
      margin: 0;
      font-size: clamp(16px, 1.8vw, 20px);
      color: var(--sub);
      font-weight: 700;
    }

    /* Controls row */
    .controls-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      align-items: flex-end;
      padding: 20px 0 8px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 140px;
    }
    .field label {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
      white-space: nowrap;
    }
    .field label .unit {
      font-size: 14px;
      color: var(--sub);
      font-weight: 700;
      margin-left: 4px;
    }
    .field input[type="number"] {
      width: 100%;
      height: 52px;
      padding: 0 14px;
      border: 1.5px solid var(--line);
      border-radius: 16px;
      background: #f7fbff;
      color: var(--ink);
      font: 800 22px "Source Han Sans SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .field input[type="number"]:focus {
      outline: 3px solid rgba(36, 94, 157, 0.18);
      border-color: rgba(36, 94, 157, 0.5);
    }

    /* Trial count selector */
    .trial-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 3 1 360px;
    }
    .trial-selector label {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
    }
    .trial-btns {
      display: flex;
      gap: 6px;
      flex-wrap: nowrap;
    }
    .trial-btn {
      height: 52px;
      padding: 0 12px;
      border: 1.5px solid rgba(36, 94, 157, 0.3);
      border-radius: 16px;
      background: #f0f6ff;
      color: var(--accent);
      font-size: 16px;
      font-weight: 900;
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .trial-btn:hover {
      background: #ddeeff;
    }
    .trial-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
      box-shadow: 0 8px 20px rgba(36, 94, 157, 0.28);
    }

    /* Bins selector */
    .bins-selector {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1 1 200px;
    }
    .bins-selector label {
      font-size: 18px;
      font-weight: 900;
      color: var(--ink);
    }
    .bins-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .bins-row input[type="range"] {
      flex: 1;
      accent-color: var(--accent);
      cursor: pointer;
      height: 6px;
    }
    .bins-val {
      min-width: 40px;
      text-align: right;
      font-size: 22px;
      font-weight: 900;
      color: var(--accent);
    }

    /* Run button */
    .run-btn {
      flex: 0 0 auto;
      align-self: flex-end;
      height: 56px;
      padding: 0 36px;
      border: none;
      border-radius: 18px;
      background: linear-gradient(135deg, #245e9d 0%, #3a7fc1 100%);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 14px 32px rgba(36, 94, 157, 0.28);
      transition: transform 0.1s, box-shadow 0.1s;
    }
    .run-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 18px 40px rgba(36, 94, 157, 0.36);
    }
    .run-btn:active {
      transform: translateY(0);
    }

    /* Stats bar */
    .stats-bar {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      margin-top: 20px;
    }
    .stat-box {
      flex: 1 1 140px;
      padding: 14px 18px;
      border-radius: 18px;
      border: 1.5px solid rgba(36, 94, 157, 0.2);
      background: linear-gradient(160deg, #f0f7ff 0%, #e4edf9 100%);
      box-shadow: 0 8px 20px rgba(36, 94, 157, 0.1);
    }
    .stat-box .stat-label {
      font-size: 15px;
      font-weight: 800;
      color: var(--sub);
      margin-bottom: 4px;
    }
    .stat-box .stat-value {
      font-size: 28px;
      font-weight: 900;
      color: var(--accent);
      line-height: 1.1;
    }

    /* Chart area */
    .chart-wrap {
      margin-top: 20px;
      padding: 20px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--card-strong);
      position: relative;
      min-height: 420px;
    }
    .chart-wrap canvas {
      width: 100% !important;
      display: block;
    }

    /* Insight banner */
    .insight {
      margin-top: 16px;
      padding: 16px 22px;
      border-radius: 16px;
      background: linear-gradient(135deg, rgba(36, 94, 157, 0.08) 0%, rgba(92, 150, 210, 0.1) 100%);
      border: 1.5px solid rgba(36, 94, 157, 0.2);
      font-size: 20px;
      font-weight: 800;
      color: var(--ink);
      text-align: center;
      line-height: 1.5;
    }
    .insight .highlight {
      color: var(--accent);
    }
    .insight .highlight2 {
      color: var(--accent2);
    }

    /* Empty state */
    .empty-state {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      color: var(--sub);
      pointer-events: none;
    }
    .empty-state .icon {
      font-size: 56px;
      opacity: 0.4;
    }
    .empty-state p {
      font-size: 20px;
      font-weight: 800;
      margin: 0;
      opacity: 0.6;
    }
  </style>
</head>
<body>
<div class="shell">

  <div class="topbar">
    <a href="index.html">← 返回主页</a>
  </div>

  <div class="panel">
    <div class="hero">
      <h1>正态分布实验室</h1>

    </div>

    <div class="controls-row">

      <!-- 均值 -->
      <div class="field">
        <label>均值 μ</label>
        <input type="number" id="mean" value="0" step="1" />
      </div>

      <!-- 方差 -->
      <div class="field">
        <label>方差 σ²<span class="unit">（σ 为标准差）</span></label>
        <input type="number" id="variance" value="1" min="0.01" step="0.1" />
      </div>

      <!-- 试验次数 -->
      <div class="trial-selector">
        <label>随机试验次数</label>
        <div class="trial-btns">
          <button class="trial-btn" data-n="20">20</button>
          <button class="trial-btn" data-n="50">50</button>
          <button class="trial-btn active" data-n="200">200</button>
          <button class="trial-btn" data-n="1000">1 000</button>
          <button class="trial-btn" data-n="5000">5 000</button>
          <button class="trial-btn" data-n="10000">10 000</button>
        </div>
      </div>

      <!-- 分组数 -->
      <div class="bins-selector">
        <label>直方图分组数</label>
        <div class="bins-row">
          <input type="range" id="bins" min="5" max="50" value="20" />
          <span class="bins-val" id="binsVal">20</span>
        </div>
      </div>

      <!-- 运行按钮 -->
      <button class="run-btn" id="runBtn">▶ 运行实验</button>

    </div>

    <!-- 统计指标 -->
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat-box">
        <div class="stat-label">样本数量</div>
        <div class="stat-value" id="statN">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">样本均值</div>
        <div class="stat-value" id="statMean">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">样本方差</div>
        <div class="stat-value" id="statVar">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">理论均值 μ</div>
        <div class="stat-value" id="statThMean">—</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">理论方差 σ²</div>
        <div class="stat-value" id="statThVar">—</div>
      </div>
    </div>

    <!-- 图表 -->
    <div class="chart-wrap">
      <div class="empty-state" id="emptyState">
        <div class="icon">📊</div>
        <p>点击「运行实验」开始</p>
      </div>
      <canvas id="chart" height="400"></canvas>
    </div>

    <!-- 洞察提示 -->
    <div class="insight" id="insight" style="display:none"></div>

  </div>
</div>

<script>
// ---- Box-Muller 正态随机数 ----
function randNormal(mu, sigma) {
  let u, v;
  do { u = Math.random(); } while (u === 0);
  do { v = Math.random(); } while (v === 0);
  return mu + sigma * Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
}

// ---- 正态PDF ----
function normalPDF(x, mu, sigma) {
  const coeff = 1 / (sigma * Math.sqrt(2 * Math.PI));
  return coeff * Math.exp(-0.5 * ((x - mu) / sigma) ** 2);
}

// ---- State ----
let selectedN = 200;
let chartInstance = null;

// ---- UI refs ----
const meanInput = document.getElementById('mean');
const varInput  = document.getElementById('variance');
const binsSlider = document.getElementById('bins');
const binsVal    = document.getElementById('binsVal');
const runBtn     = document.getElementById('runBtn');
const statsBar   = document.getElementById('statsBar');
const emptyState = document.getElementById('emptyState');
const insight    = document.getElementById('insight');
const canvas     = document.getElementById('chart');
const ctx        = canvas.getContext('2d');

// ---- Bins slider live update ----
binsSlider.addEventListener('input', () => {
  binsVal.textContent = binsSlider.value;
  if (chartInstance) reRender();
});

// ---- Trial buttons ----
document.querySelectorAll('.trial-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.trial-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedN = parseInt(btn.dataset.n);
  });
});

// ---- Run experiment ----
let lastSamples = [];

runBtn.addEventListener('click', runExperiment);

function runExperiment() {
  const mu = parseFloat(meanInput.value) || 0;
  const sigma2 = Math.max(0.01, parseFloat(varInput.value) || 1);
  const sigma = Math.sqrt(sigma2);
  const n = selectedN;

  // Generate samples
  lastSamples = Array.from({ length: n }, () => randNormal(mu, sigma));
  reRender(mu, sigma);
}

function reRender(mu, sigma) {
  if (lastSamples.length === 0) return;

  const muVal  = parseFloat(meanInput.value) || 0;
  const sig2   = Math.max(0.01, parseFloat(varInput.value) || 1);
  if (mu === undefined) mu = muVal;
  if (sigma === undefined) sigma = Math.sqrt(sig2);

  const n = lastSamples.length;
  const bins = parseInt(binsSlider.value);

  const min_ = Math.min(...lastSamples);
  const max_ = Math.max(...lastSamples);
  // Pad slightly
  const pad = (max_ - min_) * 0.05 || sigma;
  const lo = min_ - pad;
  const hi = max_ + pad;
  const width = (hi - lo) / bins;

  // Histogram counts
  const counts = new Array(bins).fill(0);
  for (const x of lastSamples) {
    const i = Math.min(bins - 1, Math.floor((x - lo) / width));
    counts[i]++;
  }
  // Normalize to density
  const densities = counts.map(c => c / (n * width));

  // Bin centers for labels
  const labels = counts.map((_, i) => {
    const center = lo + (i + 0.5) * width;
    return center.toFixed(1);
  });

  // Normal curve overlay (sample at bin centers + fine points)
  const curvePoints = 300;
  const curveStep = (hi - lo) / curvePoints;
  const curveX = Array.from({ length: curvePoints + 1 }, (_, i) => lo + i * curveStep);
  const curveY = curveX.map(x => normalPDF(x, mu, sigma));

  // Map curve to bar chart "x index" space using fractional positions
  const curveData = curveX.map(x => ({
    x: (x - lo) / width,
    y: normalPDF(x, mu, sigma)
  }));

  // Compute stats
  const sampleMean = lastSamples.reduce((a, b) => a + b, 0) / n;
  const sampleVar  = lastSamples.reduce((a, b) => a + (b - sampleMean) ** 2, 0) / (n - 1);

  // Update stat boxes
  document.getElementById('statN').textContent = n.toLocaleString('zh-CN');
  document.getElementById('statMean').textContent = sampleMean.toFixed(3);
  document.getElementById('statVar').textContent = sampleVar.toFixed(3);
  document.getElementById('statThMean').textContent = mu.toFixed(2);
  document.getElementById('statThVar').textContent = sig2.toFixed(3);
  statsBar.style.display = 'flex';

  // Destroy old chart
  if (chartInstance) {
    chartInstance.destroy();
    chartInstance = null;
  }
  emptyState.style.display = 'none';

  // Draw using Canvas API
  drawChart(densities, labels, curveData, bins, lo, hi, width, mu, sigma);

  // Insight text
  insight.style.display = 'block';
  let level, color;
  if (n <= 30)       { level = '较少'; color = 'highlight2'; }
  else if (n <= 200) { level = '中等'; color = 'highlight2'; }
  else               { level = '大量'; color = 'highlight'; }

  insight.innerHTML = `
    本次抽取了 <span class="${color}">${n}</span> 个样本（${level}数据）——
    样本量<span class="highlight2">越大</span>，直方图与
    <span class="highlight">正态曲线（蓝色）</span>吻合得越好。
  `;
}

// ---- Animated Canvas Chart ----
let animFrame = null;

function drawChart(densities, labels, curveData, bins, lo, hi, width, mu, sigma) {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }

  const dpr = window.devicePixelRatio || 1;
  const W_CSS = canvas.parentElement.clientWidth - 40;
  const H_CSS = 420;
  canvas.style.width  = W_CSS + 'px';
  canvas.style.height = H_CSS + 'px';
  canvas.width  = W_CSS * dpr;
  canvas.height = H_CSS * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const pad = { top: 28, right: 28, bottom: 72, left: 76 };
  const W = W_CSS - pad.left - pad.right;
  const H = H_CSS - pad.top  - pad.bottom;
  const maxDensity = Math.max(...densities, ...curveData.map(p => p.y));
  const yMax = maxDensity * 1.12;

  const toX  = (i)  => pad.left + (i / bins) * W;
  const toXc = (fi) => pad.left + (fi / bins) * W;
  const toY  = (d)  => pad.top + H - (d / yMax) * H;

  const DURATION = 600; // ms
  const start = performance.now();

  function frame(now) {
    const t = Math.min(1, (now - start) / DURATION);
    // ease out cubic
    const ease = 1 - Math.pow(1 - t, 3);

    ctx.clearRect(0, 0, W_CSS, H_CSS);

    // Grid lines + Y labels
    ctx.strokeStyle = 'rgba(22,32,45,0.07)';
    ctx.lineWidth = 1;
    const yTicks = 5;
    for (let i = 0; i <= yTicks; i++) {
      const y = pad.top + (i / yTicks) * H;
      ctx.beginPath();
      ctx.moveTo(pad.left, y);
      ctx.lineTo(pad.left + W, y);
      ctx.stroke();
      const val = yMax * (1 - i / yTicks);
      ctx.fillStyle = '#1a2636';
      ctx.font = `bold 18px "PingFang SC", sans-serif`;
      ctx.textAlign = 'right';
      ctx.fillText(val.toFixed(2), pad.left - 10, y + 6);
    }

    // Bars (animated height)
    const barW = W / bins;
    for (let i = 0; i < bins; i++) {
      const x = toX(i);
      const fullH = (densities[i] / yMax) * H;
      const barH  = fullH * ease;
      const y = pad.top + H - barH;
      const grad = ctx.createLinearGradient(x, y, x, pad.top + H);
      grad.addColorStop(0, 'rgba(36,94,157,0.80)');
      grad.addColorStop(1, 'rgba(36,94,157,0.28)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.roundRect(x + 1, y, barW - 2, barH, [5, 5, 0, 0]);
      ctx.fill();
    }

    // Normal curve (fade in)
    ctx.globalAlpha = ease;
    ctx.strokeStyle = '#b25733';
    ctx.lineWidth = 3.5;
    ctx.lineJoin = 'round';
    ctx.beginPath();
    let first = true;
    for (const pt of curveData) {
      const cx = toXc(pt.x);
      const cy = toY(pt.y);
      if (cx < pad.left - 2 || cx > pad.left + W + 2) continue;
      if (first) { ctx.moveTo(cx, cy); first = false; }
      else ctx.lineTo(cx, cy);
    }
    ctx.stroke();
    ctx.globalAlpha = 1;

    // Mean dashed line
    const meanFrac = (mu - lo) / (hi - lo);
    const meanXpx = pad.left + meanFrac * W;
    if (meanXpx >= pad.left && meanXpx <= pad.left + W) {
      ctx.globalAlpha = ease;
      ctx.strokeStyle = 'rgba(178,87,51,0.55)';
      ctx.lineWidth = 2;
      ctx.setLineDash([7, 5]);
      ctx.beginPath();
      ctx.moveTo(meanXpx, pad.top);
      ctx.lineTo(meanXpx, pad.top + H);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = '#b25733';
      ctx.font = `bold 17px "PingFang SC",sans-serif`;
      ctx.textAlign = 'center';
      ctx.fillText(`μ = ${mu.toFixed(1)}`, meanXpx, pad.top - 6);
      ctx.globalAlpha = 1;
    }

    // Axes
    ctx.strokeStyle = 'rgba(22,32,45,0.22)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(pad.left, pad.top);
    ctx.lineTo(pad.left, pad.top + H);
    ctx.lineTo(pad.left + W, pad.top + H);
    ctx.stroke();

    // X labels
    ctx.fillStyle = '#1a2636';
    ctx.font = `bold 18px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    const step = Math.max(1, Math.round(bins / 10));
    for (let i = 0; i <= bins; i += step) {
      const xVal = lo + i * width;
      ctx.fillText(xVal.toFixed(1), toX(i), pad.top + H + 24);
    }

    // Axis titles
    ctx.fillStyle = '#16202d';
    ctx.font = `bold 19px "PingFang SC",sans-serif`;
    ctx.textAlign = 'center';
    ctx.fillText('数值', pad.left + W / 2, H_CSS - 6);
    ctx.save();
    ctx.translate(18, pad.top + H / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('频率密度', 0, 0);
    ctx.restore();

    // Legend
    const lx = pad.left + W - 200;
    const ly = pad.top + 14;
    ctx.fillStyle = 'rgba(36,94,157,0.70)';
    ctx.fillRect(lx, ly, 24, 16);
    ctx.fillStyle = '#16202d';
    ctx.font = `bold 16px "PingFang SC",sans-serif`;
    ctx.textAlign = 'left';
    ctx.fillText('样本频率直方图', lx + 30, ly + 13);
    ctx.strokeStyle = '#b25733';
    ctx.lineWidth = 3.5;
    ctx.beginPath();
    ctx.moveTo(lx, ly + 32);
    ctx.lineTo(lx + 24, ly + 32);
    ctx.stroke();
    ctx.fillStyle = '#16202d';
    ctx.fillText('理论正态曲线', lx + 30, ly + 36);

    if (t < 1) animFrame = requestAnimationFrame(frame);
  }

  animFrame = requestAnimationFrame(frame);
}

// ---- Resize redraw ----
window.addEventListener('resize', () => {
  if (lastSamples.length > 0) reRender();
});
</script>
</body>
</html>
